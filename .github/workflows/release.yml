name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.0-alpha.1'
        type: string
        required: true
      dry-run:
        description: 'Run publish steps in dry-run mode'
        type: boolean
        default: true
      publish-nuget:
        description: 'Publish DocxSax NuGet packages when dry-run is false'
        type: boolean
        default: true
      publish-npm:
        description: 'Publish the docx-sax npm packages when dry-run is false'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      dry-run: ${{ steps.meta.outputs.dry-run }}
      publish-nuget: ${{ steps.meta.outputs.publish-nuget }}
      publish-npm: ${{ steps.meta.outputs.publish-npm }}
      npm-tag: ${{ steps.meta.outputs.npm-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          repo_version=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('Directory.Build.props').read_text()
          match = re.search(r'<Version>([^<]+)</Version>', text)
          if not match:
              raise SystemExit('Directory.Build.props has no <Version>')
          print(match.group(1))
          PY
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            dry_run="${{ inputs['dry-run'] }}"
            publish_nuget="${{ inputs['publish-nuget'] }}"
            publish_npm="${{ inputs['publish-npm'] }}"
          else
            # Branch pushes are CI proof only: always dry-run and never publish externally.
            version="$repo_version"
            dry_run="true"
            publish_nuget="false"
            publish_npm="false"
            npm_tag=""
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$version" != "$repo_version" ]]; then
            echo "Branch push version ($version) must match repo version ($repo_version)" >&2
            exit 1
          fi

          # Infer the npm dist-tag from the version suffix:
          #   1.2.3           -> latest
          #   1.2.3-alpha.1   -> alpha
          #   1.2.3-foo       -> foo
          npm_tag="latest"
          if [[ "$version" == *-* ]]; then
            prerelease_part="${version#*-}"
            npm_tag="${prerelease_part%%.*}"
          fi

          if [[ "$npm_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+($|-.*) ]]; then
            echo "Invalid npm dist-tag: $npm_tag. Use a channel tag such as latest, alpha, beta, rc, or next; not a version." >&2
            exit 1
          fi

          if ! [[ "$npm_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid npm tag: $npm_tag" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "dry-run=$dry_run"
            echo "publish-nuget=$publish_nuget"
            echo "publish-npm=$publish_npm"
            echo "npm-tag=$npm_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Release version: $version"
          echo "Dry run: $dry_run"
          echo "Publish NuGet: $publish_nuget"
          echo "Publish npm: $publish_npm"
          echo "npm dist-tag: $npm_tag"

  nuget:
    name: NuGet packages
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack NuGet packages
        run: dotnet pack --configuration Release --no-build --output artifacts/packages -p:Version=${{ needs.meta.outputs.version }}

      - name: NuGet push dry run via local feed
        if: needs.meta.outputs.dry-run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nuget-feed"
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source "$RUNNER_TEMP/nuget-feed" --skip-duplicate
          done
          find "$RUNNER_TEMP/nuget-feed" -type f -name '*.nupkg' -print

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: artifacts/packages/*.nupkg

  nuget-publish:
    name: Publish NuGet packages
    needs: [meta, nuget]
    if: needs.meta.outputs.dry-run == 'false' && needs.meta.outputs.publish-nuget == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download NuGet artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: artifacts/packages

      - name: NuGet login with trusted publishing
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  npm-build-pack:
    name: npm package (${{ matrix.artifact }})
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@docx-sax/node'
            artifact: npm-node
            setup-wasm: false
            setup-playwright: false
            runtime: node-adapter
          - package: '@docx-sax/native-linux-x64'
            artifact: npm-native-linux-x64
            setup-wasm: false
            setup-playwright: false
            runtime: linux-x64
          - package: '@docx-sax/native-darwin-arm64'
            artifact: npm-native-darwin-arm64
            setup-wasm: false
            setup-playwright: false
            runtime: darwin-arm64-placeholder
          - package: '@docx-sax/native-darwin-x64'
            artifact: npm-native-darwin-x64
            setup-wasm: false
            setup-playwright: false
            runtime: darwin-x64-placeholder
          - package: '@docx-sax/native-win32-x64'
            artifact: npm-native-win32-x64
            setup-wasm: false
            setup-playwright: false
            runtime: win32-x64-placeholder
          - package: '@docx-sax/browser'
            artifact: npm-browser
            setup-wasm: true
            setup-playwright: true
            runtime: browser-wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Apply workspace package versions
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const packageJsonPaths = [
            'package.json',
            'packages/node/package.json',
            'packages/native-linux-x64/package.json',
            'packages/native-darwin-arm64/package.json',
            'packages/native-darwin-x64/package.json',
            'packages/native-win32-x64/package.json',
            'packages/browser-wasm/package.json',
            'demos/nextjs-wasm/package.json',
          ];
          const packageNames = new Set();

          function writeJson(path, json) {
            fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          }

          for (const path of packageJsonPaths) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (json.name) packageNames.add(json.name);
            json.version = version;
            for (const key of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              for (const name of ['@docx-sax/node', '@docx-sax/browser', '@docx-sax/native-linux-x64', '@docx-sax/native-darwin-arm64', '@docx-sax/native-darwin-x64', '@docx-sax/native-win32-x64']) {
                if (json[key]?.[name] && !json[key][name].startsWith('file:')) {
                  json[key][name] = version;
                }
              }
            }
            writeJson(path, json);
          }

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages) {
            for (const [path, entry] of Object.entries(lock.packages)) {
              if (path === '' || (entry.name && packageNames.has(entry.name))) {
                entry.version = version;
              }
              for (const key of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
                for (const name of ['@docx-sax/node', '@docx-sax/browser', '@docx-sax/native-linux-x64', '@docx-sax/native-darwin-arm64', '@docx-sax/native-darwin-x64', '@docx-sax/native-win32-x64']) {
                  if (entry[key]?.[name] && !entry[key][name].startsWith('file:')) {
                    entry[key][name] = version;
                  }
                }
              }
            }
          }
          if (lock.dependencies) {
            for (const name of ['@docx-sax/node', '@docx-sax/browser', '@docx-sax/native-linux-x64', '@docx-sax/native-darwin-arm64', '@docx-sax/native-darwin-x64', '@docx-sax/native-win32-x64']) {
              if (lock.dependencies[name]) lock.dependencies[name].version = version;
            }
          }
          writeJson(lockPath, lock);
          console.log(`workspace package versions set to ${version}`);
          NODE

      - name: Install workspace dependencies
        run: npm ci

      - name: Setup .NET WASM workloads
        if: matrix.setup-wasm
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Build package
        env:
          PACKAGE: ${{ matrix.package }}
        run: npm run build --workspace "$PACKAGE"

      - name: Install browser smoke dependencies
        if: matrix.setup-playwright
        run: npx playwright install --with-deps chromium

      - name: Test package
        env:
          PACKAGE: ${{ matrix.package }}
        run: npm run test --workspace "$PACKAGE"

      - name: Pack npm package artifact
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/npm
          npm pack --workspace "$PACKAGE" --pack-destination artifacts/npm
          ls -lh artifacts/npm

      - name: npm publish dry run
        if: needs.meta.outputs.dry-run == 'true'
        run: |
          set -euo pipefail
          package=$(find artifacts/npm -maxdepth 1 -type f -name '*.tgz' | head -n 1)
          test -n "$package"
          npm publish "$package" --dry-run --access public --tag "${{ needs.meta.outputs.npm-tag }}"

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  npm-publish:
    name: Publish npm packages
    needs: [meta, npm-build-pack]
    if: needs.meta.outputs.dry-run == 'false' && needs.meta.outputs.publish-npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify npm trusted-publishing capable CLI
        run: |
          node --version
          npm --version
          node -e "const v = process.versions.node.split('.').map(Number); if (v[0] < 22 || (v[0] === 22 && v[1] < 14)) process.exit(1)"
          npm -v | node -e "const fs=require('fs'); const v=fs.readFileSync(0,'utf8').trim().split('.').map(Number); if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) process.exit(1)"

      - name: Download npm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts/npm
          merge-multiple: true

      - name: Publish npm packages with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(
            artifacts/npm/docx-sax-native-*.tgz
            artifacts/npm/docx-sax-browser-*.tgz
            artifacts/npm/docx-sax-node-[0-9]*.tgz
          )
          test "${#packages[@]}" -eq 6
          for package in "${packages[@]}"; do
            npm publish "$package" --provenance --access public --tag "${{ needs.meta.outputs.npm-tag }}"
          done

  demo-build:
    name: Demo build
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply demo package versions
        env:
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.RELEASE_VERSION;
          const packageJsonPaths = [
            'package.json',
            'packages/node/package.json',
            'packages/native-linux-x64/package.json',
            'packages/native-darwin-arm64/package.json',
            'packages/native-darwin-x64/package.json',
            'packages/native-win32-x64/package.json',
            'packages/browser-wasm/package.json',
            'demos/nextjs-wasm/package.json',
          ];
          function writeJson(path, json) {
            fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);
          }
          const workspacePackages = ['@docx-sax/node', '@docx-sax/browser', '@docx-sax/native-linux-x64', '@docx-sax/native-darwin-arm64', '@docx-sax/native-darwin-x64', '@docx-sax/native-win32-x64'];
          const versionedPackages = new Set([...workspacePackages, '@docx-sax/demo-nextjs-wasm', 'docx-sax-repo']);
          for (const path of packageJsonPaths) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            json.version = version;
            for (const key of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              for (const name of workspacePackages) {
                if (json[key]?.[name] && !json[key][name].startsWith('file:')) {
                  json[key][name] = version;
                }
              }
            }
            writeJson(path, json);
          }
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages) {
            for (const entry of Object.values(lock.packages)) {
              if (entry.name && versionedPackages.has(entry.name)) {
                entry.version = version;
              }
              for (const key of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
                for (const name of workspacePackages) {
                  if (entry[key]?.[name] && !entry[key][name].startsWith('file:')) {
                    entry[key][name] = version;
                  }
                }
              }
            }
          }
          if (lock.dependencies) {
            for (const name of workspacePackages) {
              if (lock.dependencies[name]) lock.dependencies[name].version = version;
            }
          }
          writeJson(lockPath, lock);
          console.log(`demo workspace package versions set to ${version}`);
          NODE

      - name: Setup .NET WASM workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Build demo
        run: |
          npm ci
          npm run build --workspace @docx-sax/demo-nextjs-wasm
